# prevent netscan abuse hits

# The current observed threshold seems to be 150 connections within 4 minutes to a /22 network.
# (and probably the ip address range has to be continious somehow)
# Therefore, the limit is set to 2/3 (== 25/min) of the observed value.

table ip egress_filter {

    set throttle_v4_22 {
        type ipv4_addr;
        flags interval;
        elements = {
            64.65.0.0/22,
            64.65.60.0/22,
        };
    }

    set throttle_v4_24 {
        type ipv4_addr;
        flags interval;
        elements = {
            45.84.107.0/24,
            96.9.98.0/24,
            109.70.100.0/24,
            171.25.193.0/24,
            185.220.101.0/24,
            192.42.116.0/24,
        };
    }

    # ignore the OR port intentionally
    counter throttle_v4   { packets 0 bytes 0 }
    set throttle_v4 {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 5m;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        oifname "lo" accept
        ct state established,related accept

        ip daddr @throttle_v4_22 tcp flags syn ct state new \
            add @throttle_v4 { ip daddr & 255.255.252.0 limit rate over 25/minute burst 25 packets } \
            counter name "throttle_v4" reject with icmp type port-unreachable

        ip daddr @throttle_v4_24 tcp flags syn ct state new \
            update @throttle_v4 { ip daddr & 255.255.255.0 limit rate over 25/minute burst 25 packets } \
            counter name "throttle_v4" reject with icmp type port-unreachable
    }
}
