# Avoid false abuse complaints regarding egress "port scans" when establishing
# Tor connections to /24 and /22 blocks heavily populated with Tor nodes.

# The current observed threshold seems to be 150 connections within 4 minutes to a /22 network.
# Therefore, the limit is set to 2/3 of that value == 25/min.

# become rude
# flush ruleset

# be nice
table ip egress_filter
flush table ip egress_filter

table ip egress_filter {

    set ratelimit_v4_22 {
        type ipv4_addr;
        flags interval;
        elements = {
            64.65.0.0/22,
            64.65.60.0/22,
        };
    }

    set ratelimit_v4_24 {
        type ipv4_addr;
        flags interval;
        elements = {
            45.84.107.0/24,
            96.9.98.0/24,
            109.70.100.0/24,
            171.25.193.0/24,
            185.220.101.0/24,
            192.42.116.0/24,
        };
    }

    # track network blocks
    counter ratelimit_v4   { packets 0 bytes 0 }
    set ratelimit_v4 {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 5m;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        oifname "lo" accept
        ct state established,related accept

        ip daddr @ratelimit_v4_22 tcp flags syn ct state new \
            update @ratelimit_v4 { ip daddr & 255.255.252.0 } \
            limit rate over 25/minute burst 25 packets \
            counter name "ratelimit_v4" reject with icmp type port-unreachable

        ip daddr @ratelimit_v4_24 tcp flags syn ct state new \
            update @ratelimit_v4 { ip daddr & 255.255.255.0 } \
            limit rate over 25/minute burst 25 packets \
            counter name "ratelimit_v4" reject with icmp type port-unreachable
    }
}
