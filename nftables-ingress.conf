# Ansible managed

# become rude
flush ruleset

# be nice
# table inet ingress_filter
# flush table inet ingress_filter

# (IPv4 & IPv6)
table inet ingress_filter {
    define local_address_v4 = LOCAL_ADDRESS_V4
    define local_address_v6 = [LOCAL_ADDRESS_V6]
    define network_v4_block = 255.255.255.255
    define network_v6_block = [ffff:ffff:ffff:ffff::]

    # Conntrack
    counter invalid     { packets 0 bytes 0 }
    counter badflags    { packets 0 bytes 0 }
    counter left_input  { packets 0 bytes 0 }

    # ======== ADDITIONAL BEGIN ========

    # #   e.g. Hetzner monitoring server:
    # #   getent ahostsv4 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter hetzner_v4    { packets 0 bytes 0 }
    # set hetzner_v4 {
    #     type ipv4_addr;
    #     elements = {
    #         188.40.24.211, 213.133.113.82, 213.133.113.83, 213.133.113.84, 213.133.113.86
    #     };
    # }
    # #   getent ahostsv6 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter hetzner_v6    { packets 0 bytes 0 }
    # set hetzner_v6 {
    #     type ipv6_addr;
    #     elements = {
    #         2a01:4f8:0:a101::5:1, 2a01:4f8:0:a101::6:1, 2a01:4f8:0:a101::6:2, 2a01:4f8:0:a101::6:3, 2a01:4f8:0:a112::c:1
    #     };
    # }
    # # Open port(s) { 4242 }
    # counter ports_v4_1 { packets 0 bytes 0 }
    # set ports_v4_1 {
    #     type ipv4_addr . inet_service;
    #     flags dynamic, timeout;
    #     timeout 5m;
    #     size 524288;
    # }
    # counter ports_v6_1 { packets 0 bytes 0 }
    # set ports_v6_1 {
    #     type ipv6_addr . inet_service;
    #     flags dynamic, timeout;
    #     timeout 5m;
    #     size 524288;
    # }

    # ======== ADDITIONAL END ========

    # Tarpit
    counter tarpit_v4   { packets 0 bytes 0 }
    set tarpit_v4 {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter tarpit_v6   { packets 0 bytes 0 }
    set tarpit_v6 {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    # ======== SNOWFLAKE BEGIN ========

    # counter snowflake_v4    { packets 0 bytes 0 }
    # counter snowflake_v6    { packets 0 bytes 0 }

    # ======== SNOWFLAKE END ========

    # ======== TOR DDOS BEGIN ========

    # Tor authorities
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - | jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv4 snowflake-01.torproject.net. snowflake-02.torproject.net. | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    set rule1_v4 {
        type ipv4_addr;
        elements = {
            45.66.35.11, 66.111.2.131, 128.31.0.39, 131.188.40.189, 171.25.193.9,
            193.23.244.244, 199.58.81.140, 204.13.164.118, 216.218.219.41, 217.196.147.77,
            141.212.118.18, 193.187.88.42, 193.187.88.43, 193.187.88.44, 193.187.88.45, 193.187.88.46,
        };
    }
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - | jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv6 snowflake-01.torproject.net. snowflake-02.torproject.net. | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    set rule1_v6 {
        type ipv6_addr;
        elements = {
            2a09:61c0::1337, 2610:1c0:0:5::131, 2001:638:a000:4140::ffff:189, 2001:67c:289c::9,
            2001:678:558:1000::244, 2620:13:4000:6000::1000:118, 2001:470:164:2::2, 2a02:16a8:662:2203::1,
            2a0c:dd40:1:b::42, 2607:f018:600:8:be30:5bff:fef1:c6fa,
        };
    }

    # -------- Tor DDoS NICKNAME BEGIN --------
    # DDoS rule 1
    counter rule1_v4_NICKNAME { packets 0 bytes 0 }
    counter rule1_v6_NICKNAME { packets 0 bytes 0 }

    # DDoS rule 2 Rate
    counter rule2rate_v4_NICKNAME { packets 0 bytes 0 }
    set rule2rate_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 5m;
        size 131072;
    }
    counter rule2rate_v6_NICKNAME { packets 0 bytes 0 }
    set rule2rate_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 5m;
        size 131072;
    }

    # DDoS rule 2 Drop
    counter rule2drop_v4_NICKNAME { packets 0 bytes 0 }
    set rule2drop_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter rule2drop_v6_NICKNAME { packets 0 bytes 0 }
    set rule2drop_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    # DDoS rule 3 Rate
    counter rule3rate_v4_NICKNAME { packets 0 bytes 0 }
    set rule3rate_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 150m;
        size 131072;
    }
    counter rule3rate_v6_NICKNAME { packets 0 bytes 0 }
    set rule3rate_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 150m;
        size 131072;
    }

    # DDoS rule 3 Drop
    counter rule3drop_v4_NICKNAME { packets 0 bytes 0 }
    set rule3drop_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter rule3drop_v6_NICKNAME { packets 0 bytes 0 }
    set rule3drop_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    # DDoS rule 4
    counter rule4_v4_NICKNAME { packets 0 bytes 0 }
    set rule4_v4_NICKNAME {
        type ipv4_addr
        flags dynamic
    }
    counter rule4_v6_NICKNAME { packets 0 bytes 0 }
    set rule4_v6_NICKNAME {
        type ipv6_addr
        flags dynamic
    }

    # DDoS rule 5
    counter rule5_v4_NICKNAME { packets 0 bytes 0 }
    counter rule5_v6_NICKNAME { packets 0 bytes 0 }
    # -------- Tor DDoS NICKNAME END --------

    # ======== TOR DDOS END ========

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback
        iifname "lo" accept

        # Conntrack
        ct state established,related accept
        ct state invalid counter name "invalid" drop
        tcp flags & (syn|rst|ack|fin) != syn ct state new counter name "badflags" drop

        # SSH
        tcp dport 22 tcp flags syn ct state new accept

        # DHCP
        ip protocol udp udp sport 67 udp dport 68 accept
        ip6 nexthdr udp udp sport 547 udp dport 546 accept

        # ======== ADDITIONAL BEGIN ========

        # # Prometheus
        # define metrics_port  = { ... }
        # define prometheus_v4 = ...
        # define prometheus_v6 = [...]

        # ip saddr $prometheus_v4 ip daddr $local_address_v4 tcp dport $metrics_port tcp flags syn ct state new accept
        # ip6 saddr $prometheus_v6 ip6 daddr $local_address_v6 tcp dport $metrics_port tcp flags syn ct state new accept

        # # Hetzner monitoring
        # ip saddr @hetzner_v4 counter name "hetzner_v4" accept
        # ip6 saddr @hetzner_v6 counter name "hetzner_v6" accept

        # # Open port(s) { 4242 }
        # ip daddr $local_address_v4 tcp dport { 4242 } tcp flags syn ct state new \
        #     update @ports_v4_1 { (ip saddr & $network_v4_block) . tcp dport } \
        #     limit rate over 20/minute burst 10 packets \
        #     counter name "ports_v4_1" drop

        # ip6 daddr $local_address_v6 tcp dport { 4242 } tcp flags syn ct state new \
        #     update @ports_v6_1 { (ip6 saddr & $network_v6_block) . tcp dport } \
        #     limit rate over 20/minute burst 10 packets \
        #     counter name "ports_v4_1" drop

        # ip daddr $local_address_v4 tcp dport { 4242 } tcp flags syn ct state new \
        #     accept
        # ip6 daddr $local_address_v6 tcp dport { 4242 } tcp flags syn ct state new \
        #     accept

        # ======== ADDITIONAL END ========

        # Tarpit
        (ip saddr & $network_v4_block) @tarpit_v4 counter name "tarpit_v4" drop
        (ip6 saddr & $network_v6_block) @tarpit_v6 counter name "tarpit_v6" drop

        # ======== SNOWFLAKE BEGIN ========

        # Snowflake (UDP)
        # ip daddr $local_address_v4 udp dport 32768-60999 counter name "snowflake_v4" accept
        # ip6 daddr $local_address_v6 udp dport 32768-60999 counter name "snowflake_v6" accept

        # ======== SNOWFLAKE END ========

        # ======== TOR DDOS BEGIN ========

        # -------- Tor DDoS NICKNAME BEGIN --------
        define tor_port_NICKNAME = TORPORT

        # DDoS rule 1
        ip saddr @rule1_v4 tcp dport $tor_port_NICKNAME counter name "rule1_v4_NICKNAME" accept
        ip6 saddr @rule1_v6 tcp dport $tor_port_NICKNAME counter name "rule1_v6_NICKNAME" accept

        # DDoS rule 2
        (ip saddr & $network_v4_block) @rule2drop_v4_NICKNAME counter name "rule2drop_v4_NICKNAME" drop
        (ip6 saddr & $network_v6_block) @rule2drop_v6_NICKNAME counter name "rule2drop_v6_NICKNAME" drop

        ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule2rate_v4_NICKNAME { ip saddr & $network_v4_block } \
            limit rate over 4/minute burst 8 packets \
            update @rule2drop_v4_NICKNAME { ip saddr & $network_v4_block } \
            counter name "rule2rate_v4_NICKNAME" drop

        ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule2rate_v6_NICKNAME { ip6 saddr & $network_v6_block } \
            limit rate over 4/minute burst 8 packets \
            update @rule2drop_v6_NICKNAME { ip6 saddr & $network_v6_block } \
            counter name "rule2rate_v6_NICKNAME" drop

        # DDoS rule 3
        (ip saddr & $network_v4_block) @rule3drop_v4_NICKNAME counter name "rule3drop_v4_NICKNAME" drop
        (ip6 saddr & $network_v6_block) @rule3drop_v6_NICKNAME counter name "rule3drop_v6_NICKNAME" drop

        ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule3rate_v4_NICKNAME { ip saddr & $network_v4_block } \
            limit rate over 24/hour burst 24 packets \
            update @rule2drop_v4_NICKNAME { ip saddr & $network_v4_block } \
            counter name "rule3rate_v4_NICKNAME" drop

        ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule3drop_v6_NICKNAME { ip6 saddr & $network_v6_block } \
            limit rate over 24/hour burst 24 packets \
            update @rule2drop_v6_NICKNAME { ip6 saddr & $network_v6_block } \
            counter name "rule3drop_v6_NICKNAME" drop

        # DDoS rule 4
        tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule4_v4_NICKNAME { ip saddr & $network_v4_block ct count over 8 } \
            counter name "rule4_v4_NICKNAME" drop

        tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            update @rule4_v6_NICKNAME { ip6 saddr & $network_v6_block ct count over 8 } \
            counter name "rule4_v6_NICKNAME" drop

        # DDoS rule 5
        ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            counter name "rule5_v4_NICKNAME" accept

        ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
            counter name "rule5_v6_NICKNAME" accept
        # -------- Tor DDoS NICKNAME END --------

        # ======== TOR DDOS END ========

        # ICMPv4
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 6/second burst 10 packets accept

        # ICMPv6 Error and Control Messages
        ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # ICMPv6 Ping with Rate Limit
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request limit rate 6/second burst 10 packets accept

        # IPv6 Neighbor Discovery Protocol (Enforcing hoplimit 255 for security)
        ip6 nexthdr ipv6-icmp icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } \
        ip6 hoplimit 255 accept

        # IPv6 MLD (Multicast Listener Discovery - Crucial for IPv6 stability)
        ip6 nexthdr ipv6-icmp icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-reduction, mld2-listener-report } \
        ip6 hoplimit 1 accept

        ip6 saddr fe80::/10 ip6 daddr ff02::/16 accept

        # Tarpit
        ip daddr $local_address_v4 tcp flags syn ct state new \
            update @tarpit_v4 { ip saddr & $network_v4_block } drop

        ip6 daddr $local_address_v6 tcp flags syn ct state new \
            update @tarpit_v6 { ip6 saddr & $network_v6_block } drop

        counter name "left_input"
    }
}
