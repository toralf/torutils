# https://github.com/toralf/torutils

# become rude
# flush ruleset

# be nice
table inet ingress_filter
flush table inet ingress_filter

# (IPv4 & IPv6)
table inet ingress_filter {
    define local_address_v4 = LOCAL_ADDRESS_V4
    define local_address_v6 = [LOCAL_ADDRESS_V6]
    define network_v4_block = 255.255.255.255
    define network_v6_block = [ffff:ffff:ffff:ffff::]

    # Conntrack
    counter invalid     { packets 0 bytes 0 }
    counter badflags    { packets 0 bytes 0 }
    counter left_input  { packets 0 bytes 0 }

    # ======== ADDITIONAL BEGIN ========

    # trust ip addresses

    # #   e.g. Hetzner monitoring server:
    # #   getent ahostsv4 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter trust_v4    { packets 0 bytes 0 }
    # set trust_v4 {
    #     type ipv4_addr;
    #     # elements = {};
    # }
    # #   getent ahostsv6 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter trust_v6    { packets 0 bytes 0 }
    # set trust_v6 {
    #     type ipv6_addr;
    #     # elements = {};
    # }

    # Open port(s) { 4242 }

    # counter ports_v4_1 { packets 0 bytes 0 }
    # set ports_v4_1 {
    #     type ipv4_addr . inet_service;
    #     flags dynamic, timeout;
    #     timeout 24h;
    #     size 524288;
    # }
    # counter ports_v6_1 { packets 0 bytes 0 }
    # set ports_v6_1 {
    #     type ipv6_addr . inet_service;
    #     flags dynamic, timeout;
    #     timeout 24h;
    #     size 524288;
    # }

    # ======== ADDITIONAL END ========

    # Tarpit
    counter tarpit_v4   { packets 0 bytes 0 }
    set tarpit_v4 {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter tarpit_v6   { packets 0 bytes 0 }
    set tarpit_v6 {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    # ======== SNOWFLAKE BEGIN ========

    # counter snowflake_v4    { packets 0 bytes 0 }
    # counter snowflake_v6    { packets 0 bytes 0 }

    # ======== SNOWFLAKE END ========

    # ======== TOR DDOS BEGIN ========

    # Tor authorities
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - | jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv4 snowflake-01.torproject.net. snowflake-02.torproject.net. | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    set rule1_v4 {
        type ipv4_addr;
        elements = {
            45.66.35.11, 66.111.2.131, 128.31.0.39, 131.188.40.189, 171.25.193.9,
            193.23.244.244, 199.58.81.140, 204.13.164.118, 216.218.219.41, 217.196.147.77,
            141.212.118.18, 193.187.88.42, 193.187.88.43, 193.187.88.44, 193.187.88.45, 193.187.88.46,
        };
    }
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - | jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv6 snowflake-01.torproject.net. snowflake-02.torproject.net. | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    set rule1_v6 {
        type ipv6_addr;
        elements = {
            2a09:61c0::1337, 2610:1c0:0:5::131, 2001:638:a000:4140::ffff:189, 2001:67c:289c::9,
            2001:678:558:1000::244, 2620:13:4000:6000::1000:118, 2001:470:164:2::2, 2a02:16a8:662:2203::1,
            2a0c:dd40:1:b::42, 2607:f018:600:8:be30:5bff:fef1:c6fa,
        };
    }

    # -------- Tor DDoS NICKNAME BEGIN --------
    # DDoS rule 1
    counter rule1_v4_NICKNAME { packets 0 bytes 0 }
    counter rule1_v6_NICKNAME { packets 0 bytes 0 }

    # DDoS rule 2
    counter rule2a_v4_NICKNAME { packets 0 bytes 0 }
    set rule2a_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter rule2a_v6_NICKNAME { packets 0 bytes 0 }
    set rule2a_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    counter rule2b_v4_NICKNAME { packets 0 bytes 0 }
    set rule2b_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }
    counter rule2b_v6_NICKNAME { packets 0 bytes 0 }
    set rule2b_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic, timeout;
        timeout 24h;
        size 131072;
    }

    # DDoS rule 3
    counter rule3_v4_NICKNAME { packets 0 bytes 0 }
    set rule3_v4_NICKNAME {
        type ipv4_addr;
        flags dynamic;
        size 131072;
    }
    counter rule3_v6_NICKNAME { packets 0 bytes 0 }
    set rule3_v6_NICKNAME {
        type ipv6_addr;
        flags dynamic;
        size 131072;
    }

    # DDoS rule 4
    counter rule4_v4_NICKNAME { packets 0 bytes 0 }
    counter rule4_v6_NICKNAME { packets 0 bytes 0 }
    # -------- Tor DDoS NICKNAME END --------

    # ======== TOR DDOS END ========

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback
        iifname "lo" accept

        # Conntrack
        ct state established,related accept
        ct state invalid counter name "invalid" drop
        tcp flags & (syn|rst|ack|fin) != syn ct state new counter name "badflags" drop

        # SSH
        tcp dport 22 tcp flags syn ct state new accept

        # DHCP
        ip protocol udp udp sport 67 udp dport 68 accept
        ip6 nexthdr udp udp sport 547 udp dport 546 accept

        # ======== ADDITIONAL BEGIN ========

        # # Prometheus
        # define trust_dstport    = { 1234 }
        # define trust_srcaddr_v4 = 1.2.3.4
        # define trust_srcaddr_v6 = [::]

        # ip saddr $trust_srcaddr_v4 ip daddr $local_address_v4 tcp dport $trust_dstport tcp flags syn ct state new accept
        # ip6 saddr $trust_srcaddr_v6 ip6 daddr $local_address_v6 tcp dport $trust_dstport tcp flags syn ct state new accept


        # # Trust
        # ip saddr @trust_v4 counter name trust_v4 accept
        # ip6 saddr @trust_v6 counter name trust_v6 accept

        # # Open port(s) { 4242 }
        # meta nfproto ipv4 ip daddr $local_address_v4 tcp dport { 4242 } tcp flags syn ct state new \
        # add @ports_v4_1 { ip saddr & $network_v4_block . tcp dport timeout 5m limit rate over 20/minute burst 10 packets } \
        # counter name ports_v4_1 drop

        # meta nfproto ipv6 ip6 daddr $local_address_v6 tcp dport { 4242 } tcp flags syn ct state new \
        # add @ports_v6_1 { ip6 saddr & $network_v6_block . tcp dport timeout 5m limit rate over 20/minute burst 10 packets } \
        # counter name ports_v6_1 drop

        # meta nfproto ipv4 ip daddr $local_address_v4 tcp dport { 4242 } tcp flags syn ct state new accept
        # meta nfproto ipv6 ip6 daddr $local_address_v6 tcp dport { 4242 } tcp flags syn ct state new accept

        # ======== ADDITIONAL END ========

        # Tarpit
        ip saddr & $network_v4_block @tarpit_v4 meta l4proto { tcp, udp } counter name tarpit_v4 drop
        ip6 saddr & $network_v6_block @tarpit_v6 meta l4proto { tcp, udp } counter name tarpit_v6 drop

        # ======== SNOWFLAKE BEGIN ========

        # Snowflake (UDP)
        # ip daddr $local_address_v4 udp dport 32768-60999 counter name snowflake_v4 accept
        # ip6 daddr $local_address_v6 udp dport 32768-60999 counter name snowflake_v6 accept

        # ======== TOR DDOS BEGIN ========

        # -------- Tor DDoS NICKNAME BEGIN --------
        define tor_port_NICKNAME = TORPORT

        # DDoS rule 1
        ip saddr @rule1_v4 tcp dport $tor_port_NICKNAME counter name rule1_v4_NICKNAME accept
        ip6 saddr @rule1_v6 tcp dport $tor_port_NICKNAME counter name rule1_v6_NICKNAME accept

        # DDoS rule 2
        meta nfproto ipv4 ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        add @rule2a_v4_NICKNAME { ip saddr & $network_v4_block timeout 5m limit rate over 4/minute burst 8 packets } \
        counter name rule2a_v4_NICKNAME drop

        meta nfproto ipv6 ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        add @rule2a_v6_NICKNAME { ip6 saddr & $network_v6_block timeout 5m limit rate over 4/minute burst 8 packets } \
        counter name rule2a_v6_NICKNAME drop

        meta nfproto ipv4 ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        add @rule2b_v4_NICKNAME { ip saddr & $network_v4_block timeout 150m limit rate over 24/hour burst 24 packets } \
        counter name rule2b_v4_NICKNAME drop

        meta nfproto ipv6 ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        add @rule2b_v6_NICKNAME { ip6 saddr & $network_v6_block timeout 150m limit rate over 24/hour burst 24 packets } \
        counter name rule2b_v6_NICKNAME drop

        # DDoS rule 3
        meta nfproto ipv4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        ct count over 8 ip saddr & $network_v4_block @rule3_v4_NICKNAME \
        counter name rule3_v4_NICKNAME drop

        meta nfproto ipv6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        ct count over 8 ip6 saddr & $network_v6_block @rule3_v6_NICKNAME \
        counter name rule3_v6_NICKNAME drop

        # DDoS rule 4
        meta nfproto ipv4 ip daddr $local_address_v4 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        counter name rule4_v4_NICKNAME accept

        meta nfproto ipv6 ip6 daddr $local_address_v6 tcp dport $tor_port_NICKNAME tcp flags syn ct state new \
        counter name rule4_v6_NICKNAME accept
        # -------- Tor DDoS NICKNAME END --------

        # ======== TOR DDOS END ========

        # ICMPv4
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 6/second burst 10 packets accept

        # ICMPv6 Error and Control Messages
        ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # ICMPv6 Ping with Rate Limit
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request limit rate 6/second burst 10 packets accept

        # IPv6 Neighbor Discovery Protocol (Enforcing hoplimit 255 for security)
        ip6 nexthdr ipv6-icmp icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } \
        ip6 hoplimit 255 accept

        # IPv6 MLD (Multicast Listener Discovery - Crucial for IPv6 stability)
        ip6 nexthdr ipv6-icmp icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-reduction, mld2-listener-report } \
        ip6 hoplimit 1 accept

        ip6 saddr fe80::/10 ip6 daddr ff02::/16 accept

        # Tarpit (TCP-SYN)
        meta nfproto ipv4 ip daddr $local_address_v4 tcp flags syn \
        update @tarpit_v4 { ip saddr & $network_v4_block } drop

        meta nfproto ipv6 ip6 daddr $local_address_v6 tcp flags syn \
        update @tarpit_v6 { ip6 saddr & $network_v6_block } drop

        # Tarpit (UDP)
        meta nfproto ipv4 ip daddr $local_address_v4 meta l4proto udp \
        update @tarpit_v4 { ip saddr & $network_v4_block } drop

        meta nfproto ipv6 ip6 daddr $local_address_v6 meta l4proto udp \
        update @tarpit_v6 { ip6 saddr & $network_v6_block } drop

        # This is the end my friend ...
        counter name left_input
    }
}
