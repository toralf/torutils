flush ruleset

# (IPv4 & IPv6)
table inet ingress_filter {
    define local_address_v4 = LOCAL_V4_ADDRESS
    define local_address_v6 = LOCAL_V6_ADDRESS
    define network_v4_block = 255.255.255.255
    define network_v6_block = ffff:ffff:ffff:ffff::

    chain icmp_v4 {
        # Allow essential error messages
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

        # Allow inbound ping with rate limiting
        icmp type echo-request limit rate 6/second burst 10 packets accept
    }

    chain icmp_v6 {
        # Allow essential error and control messages (e.g., Packet Too Big for PMTUD)
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # Allow inbound ping with rate limiting
        icmpv6 type echo-request limit rate 6/second burst 10 packets accept

        # Allow Neighbor Discovery Protocol (NDP - Crucial for IPv6 address resolution)
        icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # Allow Multicast Listener Discovery (MLD - Critical for local IPv6 stability; hoplimit 1 enforced)
        icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-reduction, mld2-listener-report } \
            ip6 hoplimit 1 accept
    }

    # # ======== ADDITIONAL BEGIN ========

    # #   e.g. Hetzner monitoring server:
    # #   getent ahostsv4 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter hetzner_v4    { packets 0 bytes 0 }
    # set hetzner_v4 {
    #     type ipv4_addr
    #     elements = {
    #         188.40.24.211, 213.133.113.82, 213.133.113.83, 213.133.113.84, 213.133.113.86
    #     }
    # }
    # #   getent ahostsv6 pool.sysmon.hetzner.com | awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    # counter hetzner_v6    { packets 0 bytes 0 }
    # set hetzner_v6 {
    #     type ipv6_addr
    #     elements = {
    #         2a01:4f8:0:a101::5:1, 2a01:4f8:0:a101::6:1, 2a01:4f8:0:a101::6:2, 2a01:4f8:0:a101::6:3, 2a01:4f8:0:a112::c:1
    #     }
    # }

    # # Open port/s 1

    # counter ports_v4_1    { packets 0 bytes 0 }
    # set ports_v4_1 {
    #     type ipv4_addr . inet_service
    #     flags dynamic, timeout
    #     timeout 5m
    #     size 524288
    # }
    # counter ports_v6_1    { packets 0 bytes 0 }
    # set ports_v6_1 {
    #     type ipv6_addr . inet_service
    #     flags dynamic, timeout
    #     timeout 5m
    #     size 524288
    # }

    # chain additional {
    #     # Prometheus
    #     define metrics_port  = { ... }
    #     define prometheus_v4 = ...
    #     define prometheus_v6 = ...

    #     ip saddr $prometheus_v4 ip daddr $local_address_v4 tcp dport $metrics_port ct state new counter accept
    #     ip6 saddr $prometheus_v6 ip6 daddr $local_address_v6 tcp dport $metrics_port ct state new counter accept

    #     # Hetzner monitoring
    #     ip saddr @hetzner_v4 ct state new counter name "hetzner_v4" accept
    #     ip6 saddr @hetzner_v6 ct state new counter name "hetzner_v6" accept

    #     # Open port/s 1

    #     define ports_1 = { ... }

    #     ip daddr $local_address_v4 tcp dport $ports_1 ct state new \
    #         add @ports_v4_1 { ip saddr & $network_v4_block . tcp dport limit rate over 20/minute burst 10 packets } \
    #         counter name "ports_v4_1" drop

    #     ip6 daddr $local_address_v6 tcp dport $ports_1 ct state new \
    #         add @ports_v6_1 { ip6 saddr & $network_v6_block . tcp dport limit rate over 20/minute burst 10 packets } \
    #         counter name "ports_v6_1" drop

    #     ip daddr $local_address_v4 tcp dport $ports_1 ct state new counter accept
    #     ip6 daddr $local_address_v6 tcp dport $ports_1 ct state new counter accept
    # }
    # # ======== ADDITIONAL END ========

    # # ======== SNOWFLAKE BEGIN ========
    # counter snowflake_v4    { packets 0 bytes 0 }
    # counter snowflake_v6    { packets 0 bytes 0 }

    # chain snowflake {
    #     # Snowflake (UDP)
    #     ip daddr $local_address_v4 udp dport 32768-60999 counter name "snowflake_v4" accept
    #     ip6 daddr $local_address_v6 udp dport 32768-60999 counter name "snowflake_v6" accept
    # }
    # # ======== SNOWFLAKE END ========

    # ======== TOR DDOS BEGIN ========
    # Tor address + port
    set tor_v4 {
        type ipv4_addr . inet_service
        elements = {
            $local_address_v4 . TOR_PORT
        }
    }
    set tor_v6 {
        type ipv6_addr . inet_service
        elements = {
            $local_address_v6 . TOR_PORT
        }
    }

    # DDoS rule 1 - trust Tor authorities
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - |
    #       jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv4 snowflake-01.torproject.net. snowflake-02.torproject.net. |
    #       awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    counter rule1_v4 { packets 0 bytes 0 }
    set rule1_v4 {
        type ipv4_addr
        elements = {
            45.66.35.11, 66.111.2.131, 128.31.0.39, 131.188.40.189, 171.25.193.9,
            193.23.244.244, 199.58.81.140, 204.13.164.118, 216.218.219.41, 217.196.147.77,
            141.212.118.18, 193.187.88.42, 193.187.88.43, 193.187.88.44, 193.187.88.45, 193.187.88.46,
        }
    }
    #   curl -s 'https://onionoo.torproject.org/summary?search=flag:authority' -o - |
    #       jq -cr '.relays[].a' | sort -V | xargs -r | sed 's/ /, /g'
    #   getent ahostsv6 snowflake-01.torproject.net. snowflake-02.torproject.net. |
    #       awk '{ print $1 }' | sort -uV | xargs -r | sed 's/ /, /g'
    counter rule1_v6 { packets 0 bytes 0 }
    set rule1_v6 {
        type ipv6_addr
        elements = {
            2a09:61c0::1337, 2610:1c0:0:5::131, 2001:638:a000:4140::ffff:189, 2001:67c:289c::9,
            2001:678:558:1000::244, 2620:13:4000:6000::1000:118, 2001:470:164:2::2, 2a02:16a8:662:2203::1,
            2a0c:dd40:1:b::42, 2607:f018:600:8:be30:5bff:fef1:c6fa,
        }
    }

    # block DDoS classified by rule 2 - 4
    counter ddos_v4 { packets 0 bytes 0 }
    set ddos_v4 {
        type ipv4_addr
        flags dynamic, timeout
        timeout 24h
        size 131072
    }
    counter ddos_v6 { packets 0 bytes 0 }
    set ddos_v6 {
        type ipv6_addr
        flags dynamic, timeout
        timeout 24h
        size 131072
    }

    # DDoS rule 2 - rate limit 8 connections per min
    counter rule2_v4    { packets 0 bytes 0 }
    set rule2_v4 {
        type ipv4_addr . inet_service . ipv4_addr
        flags dynamic, timeout
        timeout 5m
        size 131072
    }
    counter rule2_v6    { packets 0 bytes 0 }
    set rule2_v6 {
        type ipv6_addr . inet_service . ipv6_addr
        flags dynamic, timeout
        timeout 5m
        size 131072
    }

    # DDoS rule 3 - rate limit 24 connections per hour
    counter rule3_v4    { packets 0 bytes 0 }
    set rule3_v4 {
        type ipv4_addr . inet_service . ipv4_addr
        flags dynamic, timeout
        timeout 2h
        size 131072
    }
    counter rule3_v6    { packets 0 bytes 0 }
    set rule3_v6 {
        type ipv6_addr . inet_service . ipv6_addr
        flags dynamic, timeout
        timeout 2h
        size 131072
    }

    # DDoS rule 4 - not more than 8 connections per remote to same Tor port
    counter rule4_v4    { packets 0 bytes 0 }
    set rule4_v4 {
        type ipv4_addr . inet_service . ipv4_addr
        flags dynamic
        size 131072
    }
    counter rule4_v6    { packets 0 bytes 0 }
    set rule4_v6 {
        type ipv6_addr . inet_service . ipv6_addr
        flags dynamic
        size 131072
    }

    # DDoS rule 5 - allow
    counter rule5_v4    { packets 0 bytes 0 }
    counter rule5_v6    { packets 0 bytes 0 }

    chain tor_v4 {
        # DDoS rule 1
        ip saddr @rule1_v4 counter name "rule1_v4" accept

        # block known DDoS
        ip saddr & $network_v4_block @ddos_v4 counter name "ddos_v4" drop

        # --- DDoS rule 2 ---
        add @rule2_v4 { ip saddr & $network_v4_block . tcp dport . ip daddr limit rate over 8/minute burst 8 packets } \
            update @ddos_v4 { ip saddr & $network_v4_block } \
            counter name "ddos_v4" drop

        # --- DDoS rule 3 ---
        add @rule3_v4 { ip saddr & $network_v4_block . tcp dport . ip daddr limit rate over 24/hour burst 8 packets } \
            update @ddos_v4 { ip saddr & $network_v4_block } \
            counter name "ddos_v4" drop

        # --- DDoS rule 4 ---
        update @rule4_v4 { ip saddr & $network_v4_block . tcp dport . ip daddr ct count over 8 } \
            counter name "ddos_v4" drop

        # --- DDoS rule 5 ---
        counter name "rule5_v4" accept
    }

    chain tor_v6 {
        # DDoS rule 1
        ip6 saddr @rule1_v6 counter name "rule1_v6" accept

        # block known DDoS
        ip6 saddr & $network_v6_block @ddos_v6 counter name "ddos_v6" drop

        # --- DDoS rule 2 ---
        add @rule2_v6 { ip6 saddr & $network_v6_block . tcp dport . ip6 daddr limit rate over 8/minute burst 8 packets } \
            update @ddos_v6 { ip6 saddr & $network_v6_block } \
            counter name "ddos_v6" drop

        # --- DDoS rule 3 ---
        add @rule3_v6 { ip6 saddr & $network_v6_block . tcp dport . ip6 daddr limit rate over 24/hour burst 8 packets } \
            update @ddos_v6 { ip6 saddr & $network_v6_block } \
            counter name "ddos_v6" drop

        # --- DDoS rule 4 ---
        update @rule4_v6 { ip6 saddr & $network_v6_block . tcp dport . ip6 daddr ct count over 8 } \
            counter name "ddos_v6" drop

        # --- DDoS rule 5 ---
        counter name "rule5_v6" accept
    }
    # ======== TOR DDOS END ========


    # Conntrack
    counter ct_x_established    { packets 0 bytes 0 }
    counter ct_x_invalid        { packets 0 bytes 0 }
    counter ct_x_badflags       { packets 0 bytes 0 }
    counter left_v4_input       { packets 0 bytes 0 }
    counter left_v6_input       { packets 0 bytes 0 }

    chain prerouting {
        type filter hook prerouting priority dstnat; policy accept;

        tcp flags & (syn|rst|ack|fin) != syn ct state new counter name "ct_x_badflags" drop
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback
        iifname "lo" accept

        # Conntrack
        ct state established,related counter name "ct_x_established" accept
        ct state invalid counter counter name "ct_x_invalid" drop

        # IPv6: Multicast
        ip6 saddr fe80::/10 ip6 daddr ff02::/16 counter accept

        # IPv6: Link-Local
        ip6 saddr fe80::/10 ip6 daddr fe80::/10 counter accept

        # SSH
        tcp dport 22 ct state new counter accept

        # DHCP
        ip protocol udp udp sport 67 udp dport 68 counter accept
        ip6 nexthdr udp udp sport 547 udp dport 546 counter accept

        # ICMP
        ip protocol icmp counter jump icmp_v4
        ip6 nexthdr ipv6-icmp counter jump icmp_v6

        # # ======== ADDITIONAL BEGIN ========
        # # additional
        # counter jump additional
        # # ======== ADDITIONAL END ========

        # # ======== SNOWFLAKE BEGIN ========
        # # Snowflake
        # counter jump snowflake
        # # ======== SNOWFLAKE END ========

        # ======== TOR DDOS BEGIN ========
        # Tor
        ip daddr . tcp dport @tor_v4 ct state new counter jump tor_v4
        ip6 daddr . tcp dport @tor_v6 ct state new counter jump tor_v6
        # ======== TOR DDOS END ========

        # Uncovered packets
        meta nfproto ipv4 counter name "left_v4_input"
        meta nfproto ipv6 counter name "left_v6_input"

        comment "DDoS is activated"
    }
}